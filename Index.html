<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HRIS CV. Andela Jaya</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" type="image/png">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Anti scroll ganda */
            background-color: #f8fafc;
        }
        
        /* Trik menyembunyikan banner Google dengan menarik iframe ke atas 36 pixel */
        #app-frame {
            border: none;
            width: 100%;
            height: calc(100vh + 36px);
            margin-top: -36px; 
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="" allow="camera; microphone; fullscreen; clipboard-read; clipboard-write; autoplay"></iframe>

    <script>
        // URL Apps Script Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxoMXyPok3IL8et5RO05dZq4kSArhjNCGKx_Ug5YMPJgc-IHWrsk5K9lmBHrMGHk17W/exec";

        // Tangkap parameter (seperti ?item=ATK-001 dari QR Scan)
        const queryString = window.location.search; 
        
        // Teruskan ke dalam Google Apps Script secara tersembunyi
        document.getElementById('app-frame').src = GAS_URL + queryString;
    </script>
</body>
</html>
